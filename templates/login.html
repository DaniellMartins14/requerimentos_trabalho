{% extends "layout/base_limpa.html" %}

{% block titulo_aba %}Login | HD2R{% endblock %}

{% block conteudo %}
<div class="card p-4 p-md-5">
    <div class="mb-4 text-center">
        <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="Logo HD2R" style="max-width:150px" class="mb-3">
        <h1 class="h2 fw-bold mt-2">Entrar</h1>
        <p class="text-secondary mb-0">Acesse o sistema com o e-mail e a senha do seu cadastro.</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}" id="formLogin" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ proximo or '' }}">
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">E-mail *</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="nome@email.com"
                   value="{{ dados.get('email','') }}" autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
            <label for="senha" class="form-label fw-semibold">Senha *</label>
            <div class="input-group">
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha"
                       autocomplete="current-password" required>
                <button type="button" class="btn btn-outline-secondary" id="mostrarSenha" aria-label="Mostrar ou ocultar a senha">
                    <i class="bi bi-eye" id="iconeSenha"></i>
                </button>
            </div>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-verde btn-lg"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
        </div>
    </form>
    <hr class="my-4">
    <p class="text-center text-secondary mb-0">Ainda não tem cadastro?
        <a href="{{ url_for('cadastro') }}" class="fw-semibold text-success">Cadastre-se</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
const campoSenha = document.getElementById('senha');
const iconeSenha = document.getElementById('iconeSenha');
document.getElementById('mostrarSenha').addEventListener('click', function () {
    const oculta = campoSenha.type === 'password';
    campoSenha.type = oculta ? 'text' : 'password';
    iconeSenha.className = oculta ? 'bi bi-eye-slash' : 'bi bi-eye';
});
</script>
{% endblock %}
